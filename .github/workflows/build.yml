name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            build-tools;35.0.0
            ndk;27.2.12479018
          cache: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyAssignments-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          compression-level: 6

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyAssignments-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          compression-level: 6

      - name: Display APK Info
        run: |
          echo "=== Release APK ==="
          find app/build/outputs/apk/release -name "*.apk" -exec ls -lh {} \;
          echo "=== Debug APK ==="
          find app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \;